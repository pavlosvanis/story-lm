[project]
name = "story-lm"
version = "1.0.6"
description = "A Transformer language model built from scratch for story generation."
requires-python = ">=3.11,<3.14"
dependencies = [
    "einops>=0.8.1", # tensor operations
    "einx>=0.3.0", # more general tensor operations
    "jaxtyping>=0.3.0", # type hints for pytorch/jax/numpy
    "numpy<2",
    "psutil>=6.1.1",
    "pytest>=8.3.4",
    "pytest-json-report>=1.5.0",
    "regex>=2024.11.6", # more powerful regex than the builtin `re` module
    "submitit>=1.5.2", # job submission for SLURM
    "tiktoken>=0.9.0",
    "torch~=2.6.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "torch~=2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'", # Intel Macs
    "tqdm>=4.67.1",
    "wandb>=0.19.7",
    "ty>=0.0.1a16",
]

[build-system]
requires = ["uv_build>=0.8.3,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "storylm"
module-root = "src"

[tool.uv]
package = true
python-preference = "managed"

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "WARNING"
addopts = "-s"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint.extend-per-file-ignores]
# Package initializers may expose public imports.
"__init__.py" = ["E402", "F401", "F403", "E501"]

[dependency-groups]
dev = [
    "matplotlib>=3.8",
    "ruff==0.16.9",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "UP", "I", "D2", "D3"]
# jaxtyping uses tensor shapes as string annotations.
ignore = ["F722"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
